name: Test filtering a subset of matrix items
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inputFile: 'tests/fixtures/matrix_includes.json'
          filter: '[?runOnBranch==`always`]'
          addInclude: 'true'
      - name: Assert matrix output contains only ubuntu-latest
        env:
          MATRIX: ${{ steps.action.outputs.matrix }}
        run: |
          echo "matrix: $MATRIX"
          if echo "$MATRIX" | grep -q '"ubuntu-latest"'; then
            echo "PASS: output contains ubuntu-latest (runOnBranch=always)"
          else
            echo "FAIL: expected output to contain ubuntu-latest"
            exit 1
          fi
      - name: Assert matrix output does not contain windows-latest
        env:
          MATRIX: ${{ steps.action.outputs.matrix }}
        run: |
          echo "matrix: $MATRIX"
          if echo "$MATRIX" | grep -q '"windows-latest"'; then
            echo "FAIL: output should not contain windows-latest (runOnBranch=main)"
            exit 1
          else
            echo "PASS: output correctly excludes windows-latest"
          fi
      - name: Assert matrix output does not contain macos-latest
        env:
          MATRIX: ${{ steps.action.outputs.matrix }}
        run: |
          echo "matrix: $MATRIX"
          if echo "$MATRIX" | grep -q '"macos-latest"'; then
            echo "FAIL: output should not contain macos-latest (runOnBranch=release)"
            exit 1
          else
            echo "PASS: output correctly excludes macos-latest"
          fi
      - name: Assert matrix output contains include wrapper
        env:
          MATRIX: ${{ steps.action.outputs.matrix }}
        run: |
          echo "matrix: $MATRIX"
          if echo "$MATRIX" | grep -q '"include"'; then
            echo "PASS: output contains include wrapper"
          else
            echo "FAIL: expected include wrapper"
            exit 1
          fi
