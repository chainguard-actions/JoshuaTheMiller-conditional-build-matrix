name: Test addInclude false - raw JSON output without include wrapper
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inputFile: 'tests/fixtures/matrix_includes.json'
          filter: '[*]'
          addInclude: 'false'
      - name: Assert matrix output does NOT contain include wrapper
        env:
          MATRIX: ${{ steps.action.outputs.matrix }}
        run: |
          echo "matrix: $MATRIX"
          if echo "$MATRIX" | grep -q '"include"'; then
            echo "FAIL: output should not contain 'include' wrapper when addInclude=false"
            exit 1
          else
            echo "PASS: output does not contain include wrapper"
          fi
      - name: Assert matrix output is a JSON array
        env:
          MATRIX: ${{ steps.action.outputs.matrix }}
        run: |
          echo "matrix: $MATRIX"
          # Should start with '[' since it's a raw array
          TRIMMED="$(echo "$MATRIX" | tr -d '[:space:]')"
          if [[ "$TRIMMED" == \[* ]]; then
            echo "PASS: output is a JSON array"
          else
            echo "FAIL: expected output to be a JSON array starting with '['"
            exit 1
          fi
      - name: Assert matrix output contains ubuntu-latest
        env:
          MATRIX: ${{ steps.action.outputs.matrix }}
        run: |
          echo "matrix: $MATRIX"
          if echo "$MATRIX" | grep -q '"ubuntu-latest"'; then
            echo "PASS: output contains ubuntu-latest"
          else
            echo "FAIL: expected output to contain ubuntu-latest"
            exit 1
          fi
