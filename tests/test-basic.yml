name: Test basic usage with include wrapper
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create matrix input file
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/matrix_includes.json <<'EOF'
          [
            {"os": "ubuntu-latest", "node": "16"},
            {"os": "windows-latest", "node": "18"}
          ]
          EOF

      - id: action
        uses: .
        with:
          inputFile: '.github/workflows/matrix_includes.json'
          filter: '[*]'
          addInclude: 'true'

      - name: Assert matrix output contains include wrapper
        env:
          MATRIX: ${{ steps.action.outputs.matrix }}
        run: |
          echo "matrix: $MATRIX"
          if echo "$MATRIX" | grep -q '"include"'; then
            echo "PASS: output contains include wrapper"
          else
            echo "FAIL: expected output to contain 'include' key"
            exit 1
          fi

      - name: Assert matrix output contains expected data
        env:
          MATRIX: ${{ steps.action.outputs.matrix }}
        run: |
          echo "matrix: $MATRIX"
          if echo "$MATRIX" | grep -q '"ubuntu-latest"'; then
            echo "PASS: output contains expected os value"
          else
            echo "FAIL: expected output to contain 'ubuntu-latest'"
            exit 1
          fi
          if echo "$MATRIX" | grep -q '"windows-latest"'; then
            echo "PASS: output contains windows-latest"
          else
            echo "FAIL: expected output to contain 'windows-latest'"
            exit 1
          fi
