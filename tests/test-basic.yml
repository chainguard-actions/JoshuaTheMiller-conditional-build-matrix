name: Test basic usage with addInclude true
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          inputFile: tests/fixtures/matrix_includes.json
          filter: "[?runTests == `true`]"
          addInclude: "true"

      - name: Assert matrix output contains include wrapper
        env:
          MATRIX: ${{ steps.action.outputs.matrix }}
        run: |
          echo "matrix: $MATRIX"
          # Should start with {"include":
          if ! echo "$MATRIX" | grep -q '"include"'; then
            echo "FAIL: expected output to contain 'include' wrapper"
            exit 1
          fi
          echo "PASS: output contains include wrapper"

      - name: Assert matrix output contains linux amd64
        env:
          MATRIX: ${{ steps.action.outputs.matrix }}
        run: |
          echo "matrix: $MATRIX"
          if ! echo "$MATRIX" | grep -q '"linux"'; then
            echo "FAIL: expected output to contain linux platform"
            exit 1
          fi
          if ! echo "$MATRIX" | grep -q '"amd64"'; then
            echo "FAIL: expected output to contain amd64 arch"
            exit 1
          fi
          echo "PASS: output contains expected filtered entries"

      - name: Assert matrix output excludes entries where runTests is false
        env:
          MATRIX: ${{ steps.action.outputs.matrix }}
        run: |
          echo "matrix: $MATRIX"
          # The filter [?runTests == `true`] should exclude linux/arm64 and macos/amd64
          # We check that windows is present (runTests: true) and arm64 is NOT present
          # (linux/arm64 has runTests: false, macos/amd64 has runTests: false)
          # Count occurrences of "amd64" - should be 2 (linux+windows), not 3
          COUNT=$(echo "$MATRIX" | grep -o '"amd64"' | wc -l)
          echo "amd64 count: $COUNT"
          if [ "$COUNT" -ne 2 ]; then
            echo "FAIL: expected 2 amd64 entries (linux+windows with runTests=true), got $COUNT"
            exit 1
          fi
          echo "PASS: filtered correctly to only runTests=true entries"
